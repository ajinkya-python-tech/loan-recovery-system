<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recovery System Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(to right,#000428,#004e92);
        }

        .login-container{

            width:420px;
            background:rgba(255,255,255,0.08);
            padding:40px;
            border-radius:20px;
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.1);
            color:white;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        .badge{

            display:inline-block;
            background:rgba(34,197,94,0.2);
            color:#4ade80;
            padding:10px 20px;
            border-radius:50px;
            font-size:14px;
            margin-bottom:20px;
            border:1px solid rgba(74,222,128,0.3);
        }

        h1{
            font-size:52px;
            margin-bottom:10px;
            line-height:1.1;
        }

        .subtitle{
            color:#94a3b8;
            margin-bottom:30px;
            font-size:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:15px;
        }

        input{

            width:100%;
            padding:16px;
            margin-bottom:20px;
            border:none;
            border-radius:12px;
            background:rgba(255,255,255,0.1);
            color:white;
            font-size:16px;
            outline:none;
        }

        input::placeholder{
            color:#9ca3af;
        }

        button{

            background:#2563eb;
            color:white;
            border:none;
            padding:15px 30px;
            border-radius:12px;
            cursor:pointer;
            font-size:18px;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        .error{

            background:rgba(239,68,68,0.2);
            color:#fca5a5;
            padding:12px;
            border-radius:10px;
            margin-top:20px;
            border:1px solid rgba(239,68,68,0.3);
        }

        .signup-link{

            margin-top:25px;
            text-align:center;
            color:#cbd5e1;
        }

        .signup-link a{

            color:#60a5fa;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="badge">
            Secure Login
        </div>

        <h1>Recovery System Login</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <form method="POST" action="{% url 'login' %}">

            {% csrf_token %}

            <label>Username</label>

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <div class="signup-link">
            Don't have an account?
            <a href="{% url 'signup' %}">
                Sign Up
            </a>
        </div>

    </div>

</body>
</html>
